  description: A discrete generative model of neuronal spiking activity recorded on high-density microelectrode arrays. A residual vector-quantized autoencoder learns a shared vocabulary of spatiotemporal motifs, and a factorized masked transformer generates array-wide activity, evaluated on human brain organoids and ex vivo human hippocampal tissue.
  tags:
